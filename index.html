<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NotePaint — Explore Music</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster+Two:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="guitar/NotePaint.png">
    <link rel="apple-touch-icon" href="guitar/NotePaint.png">   

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <main class="home-container">

        <header class="home-header">
            <h1>NotePaint</h1>
            
        </header>

        <section class="instrument-grid" aria-label="Choose an instrument">

            <a class="instrument-card" href="guitar/index.html">
                <div class="instrument-art guitar-art" aria-hidden="true">
                    <img src="NotePaint Guitar.png" alt="">
                </div>

                <h2>Guitar</h2>
               

                <span class="card-button">Explore Guitar</span>
            </a>

            <a class="instrument-card" href="piano/index.html">
                <div class="instrument-art piano-art" aria-hidden="true">
                    <img src="NotePaint Piano.png" alt="">
                </div>

                <h2>Piano</h2>
                

                <span class="card-button">Explore Piano</span>
            </a>

        </section>

        <footer class="home-footer">
            <p>More musical tools coming soon...</p>
        </footer>

    </main>

</body>

</html>
